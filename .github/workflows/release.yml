name: release

# Tag `luma-b<n>` (or run manually) to build sd-server + sd-cli
# with the patch stack applied and publish the LumaBrowser-consumable
# release assets: a Windows x64 CUDA 12 pair, a Windows on Arm CUDA 13 pair
# and a Linux arm64 CUDA 13 pair.
# The x64 CUDA kernel compile across nine archs is slow on hosted runners
# (~2h) — this is a per-release build, not per-push CI. A manual run can
# build one target only and uploads the zips as workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which builds to run'
        type: choice
        options: [all, x64, arm64, linux-arm64]
        default: all
  push:
    tags:
      - 'luma-b*'

permissions:
  contents: write

jobs:
  windows-cuda:
    # inputs.targets is empty on a tag push, so every build runs.
    if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'x64'
    runs-on: windows-2022
    steps:
      # Supply-chain policy: every third-party action is pinned to a full
      # commit SHA (tags are mutable — a moved tag is arbitrary code running
      # with this repo's write token), and every direct download is verified
      # against a recorded SHA-256 from the project's official release.
      - name: Checkout patch repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install CUDA toolkit
        # Downloads from developer.download.nvidia.com (NVIDIA's own CDN).
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          # 12.8 is the first toolkit that knows Blackwell (compute_120);
          # 12.4 fails with "Unsupported gpu architecture 'compute_120'".
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","visual_studio_integration"]'

      - name: Install ninja (official release, checksum-verified)
        shell: pwsh
        run: |
          $url = 'https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip'
          $sha = 'f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a'
          Invoke-WebRequest -Uri $url -OutFile ninja.zip
          $got = (Get-FileHash ninja.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "ninja-win.zip checksum mismatch: $got" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\ninja"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ninja"

      - name: Apply patch stack to pinned upstream
        shell: pwsh
        run: |
          git config --global user.email "ci@lumabyte.com"
          git config --global user.name "luma-sdcpp CI"
          .\scripts\checkout.ps1

      - name: Build and package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne 'tag') { $tag = "manual-$($env:GITHUB_SHA.Substring(0,7))" }
          .\scripts\build-windows-cuda.ps1 -Tag $tag -CudaPath $env:CUDA_PATH -Jobs ([Environment]::ProcessorCount)

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-x64
          path: dist/*.zip

  windows-cuda-arm64:
    # Windows on Arm (the RTX Spark's sm_121 Blackwell), built natively on an
    # Arm runner: ggml only accepts MSVC for ARM with GGML_NATIVE=ON, which
    # probes the build host's CPU features, and the runner's Neoverse N2
    # (ARMv9.0) is a subset of the RTX Spark N1X's ARMv9.2 cores.
    if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'arm64'
    runs-on: windows-11-arm
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install CUDA 13.4 for Windows ARM64 (NVIDIA redist, checksum-verified)
        # Downloads from developer.download.nvidia.com (NVIDIA's own CDN); the
        # SHA-256s are NVIDIA's own, from redistrib_13.4.3.json. nvcc is a native
        # ARM64 binary; the cudart/cuBLAS archives carry lib\arm64 and bin\arm64.
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist/'
          $archives = @(
            @("cuda_nvcc/windows-arm64/cuda_nvcc-windows-arm64-13.4.92-archive.zip", "8ca6e46052dba9e1a3e72d071ce83079e7edf70020f94eac54de55689b0d2141"),
            @("cuda_crt/windows-arm64/cuda_crt-windows-arm64-13.4.92-archive.zip", "3fa09349f4af5a39ffb806ce48db9c406f81fcd3366e066fdca6eba97927764a"),
            @("libnvvm/windows-arm64/libnvvm-windows-arm64-13.4.92-archive.zip", "3bd0c42bca5f16a6055b32a10535e48c23e8701eb9c9fbb7e6eff655841cfe9d"),
            @("cccl/windows-arm64/cccl-windows-arm64-13.3.4.3.1-archive.zip", "e298fc4546a889a4d8329657eac567d93a082c0480d7c9b23690d28d8753d21d"),
            @("cuda_cudart/windows-arm64/cuda_cudart-windows-arm64-13.4.92-archive.zip", "d3cec2717ba3c2c714c5869a5374365d087c698d87c0ddd3bd41715447112891"),
            @("libcublas/windows-arm64/libcublas-windows-arm64-13.8.0.4-archive.zip", "ec79698528f64361a370d1b0254a927e369b57525831fadcb2cdb7732d8ab621"),
            @("cuda_profiler_api/windows-arm64/cuda_profiler_api-windows-arm64-13.4.92-archive.zip", "feb00b603591129ba12ed768edeb9ae671a051b2d9207fff842f7aa83b19d9cb"),
            @("cuda_nvrtc/windows-arm64/cuda_nvrtc-windows-arm64-13.4.92-archive.zip", "fee31ad3a953e56a52015f29c237fb15bcd2ddc14676c1aec03a9384aa807383")
          )
          $cuda = Join-Path $env:RUNNER_TEMP 'cuda-13.4-arm64'
          New-Item -ItemType Directory -Force $cuda | Out-Null
          foreach ($a in $archives) {
            $zip = Join-Path $env:RUNNER_TEMP (Split-Path $a[0] -Leaf)
            Invoke-WebRequest -Uri ($base + $a[0]) -OutFile $zip
            $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $a[1]) { throw "$(Split-Path $a[0] -Leaf) checksum mismatch: $got" }
            # Each archive holds one top folder (<name>-archive\{bin,include,lib}); merge its contents.
            $stage = Join-Path $env:RUNNER_TEMP ('x-' + [IO.Path]::GetFileNameWithoutExtension($zip))
            Expand-Archive $zip -DestinationPath $stage -Force
            Copy-Item (Join-Path (Get-ChildItem $stage -Directory | Select-Object -First 1).FullName '*') $cuda -Recurse -Force
          }
          & (Join-Path $cuda 'bin\nvcc.exe') --version
          Add-Content $env:GITHUB_ENV "CUDA_ARM64_PATH=$cuda"

      - name: Install VS 2022 Build Tools with ARM64 C++ (Microsoft-signed bootstrapper)
        # windows-11-arm ships VS 2026 (18.x) only, whatever its image README
        # says. The build is proven with the VS 2022 (17.x) toolset, the same
        # one the x64 job uses with nvcc, so install VS 2022 Build Tools beside
        # it. aka.ms serves a moving bootstrapper, so instead of a pinned
        # SHA-256 it must carry a valid Authenticode signature from Microsoft.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $have = { & $vswhere -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath }
          & $vswhere -all -prerelease -products * -format text | Select-String 'installationPath|installationVersion' | ForEach-Object { Write-Host "  $_" }
          if (& $have) { Write-Host 'VS 2022 with VC.Tools.ARM64 already present'; exit 0 }
          $boot = Join-Path $env:RUNNER_TEMP 'vs_BuildTools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_BuildTools.exe' -OutFile $boot
          $sig = Get-AuthenticodeSignature $boot
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "vs_BuildTools.exe signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Write-Host "bootstrapper signed by: $($sig.SignerCertificate.Subject)"
          $p = Start-Process -FilePath $boot -Wait -PassThru -ArgumentList @(
            '--quiet', '--wait', '--norestart', '--nocache',
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100')
          # 3010 is "succeeded, reboot recommended", which a build does not need.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "VS Build Tools installer exited $($p.ExitCode)" }
          $vs = & $have
          if (-not $vs) { throw 'VS 2022 VC.Tools.ARM64 still missing after the installer ran.' }
          Write-Host "VS 2022 Build Tools with ARM64 C++ at $vs"
          Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostarm64\arm64\cl.exe" | ForEach-Object { Write-Host "  cl: $($_.FullName)" }

      - name: Install ninja (official release, checksum-verified)
        shell: pwsh
        run: |
          $url = 'https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-winarm64.zip'
          $sha = '79c96a50e0deafec212cfa85aa57c6b74003f52d9d1673ddcd1eab1c958c5900'
          Invoke-WebRequest -Uri $url -OutFile ninja.zip
          $got = (Get-FileHash ninja.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "ninja-winarm64.zip checksum mismatch: $got" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\ninja"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ninja"

      - name: Apply patch stack to pinned upstream
        shell: pwsh
        run: |
          git config --global user.email "ci@lumabyte.com"
          git config --global user.name "luma-sdcpp CI"
          .\scripts\checkout.ps1

      - name: Build and package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne 'tag') { $tag = "manual-$($env:GITHUB_SHA.Substring(0,7))" }
          .\scripts\build-windows-cuda-arm64.ps1 -Tag $tag -CudaPath $env:CUDA_ARM64_PATH -Jobs ([Environment]::ProcessorCount)

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-arm64
          path: dist/*.zip

  linux-cuda-arm64:
    # Linux on Arm with an NVIDIA GPU (DGX Spark, Jetson, Arm servers), built
    # natively on an Arm runner inside NVIDIA's CUDA devel image: the same
    # recipe as ggml-org's ubuntu-cuda arm64 release build. Ubuntu 24.04 sets
    # the glibc floor (2.39).
    if: inputs.targets == '' || inputs.targets == 'all' || inputs.targets == 'linux-arm64'
    runs-on: ubuntu-24.04-arm
    # Docker Hub (NVIDIA's official image), pinned to the linux/arm64 manifest
    # digest of the 13.5.0-devel-ubuntu24.04 tag: a tag alone is mutable.
    container: nvidia/cuda:13.5.0-devel-ubuntu24.04@sha256:b3334ee11120210fb23887a797905003c170b5566101931d99c19413ed32b80d
    steps:
      # The image has no git, and checkout wants a real one. Everything here
      # comes from Ubuntu's signed archive. gcc-14: GCC 13 does not know the
      # 'sme' feature ggml's armv9.2 CPU variant is compiled with.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build gcc-14 g++-14

      - name: Checkout patch repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Apply patch stack to pinned upstream
        shell: bash
        run: |
          git config --global user.email "ci@lumabyte.com"
          git config --global user.name "luma-sdcpp CI"
          bash scripts/checkout.sh

      - name: Build and package
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != 'tag' ]; then tag="manual-${GITHUB_SHA:0:7}"; fi
          bash scripts/build-linux-cuda-arm64.sh -t "$tag" -j "$(nproc)"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux-arm64
          path: dist/*.tar.gz

  publish:
    # One release from every build, so the jobs never race to create it.
    if: github.ref_type == 'tag'
    needs: [windows-cuda, windows-cuda-arm64, linux-cuda-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.tar.gz \
            --title "${{ github.ref_name }}" \
            --notes "Patched stable-diffusion.cpp build (upstream $(head -n 1 UPSTREAM_REF)). Windows x64 (CUDA 12), Windows on Arm (CUDA 13, RTX Spark) and Linux arm64 (CUDA 13). See README for the patch stack."
